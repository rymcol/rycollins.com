[params]
  # Enable the darkmode toggle in header
  darkModeToggle = true
  
  # Enable search in header
  enableSearch = true

  # Custom copyright - optional
  copyright = "Copyright © 2022 Ryan Collins; All rights reserved"
  favicon = "/favicon.svg"

  # Color for the intro details and social links block, not applicable for dark mode
  # Supported values: Any color from TailwindCSS default colors
  # Reference: https://tailwindcss.com/docs/customizing-colors
  ascentColor = "bg-blue-100"

[params.homepage.social]
  # Global params common for both languages
  title = "Connect with me"
  description = "Amateur Radio: VA3RYC, KO4YVB"
  twitter = "https://twitter.com/rymcol"
  linkedin = "https://linkedin.com/in/rymcol"
  github = "https://github.com/rymcol"
  gitlab = "https://gitlab.com/rymcol"
  dribbble = "https://dribbble.com/rymcol"
  youtube = "https://www.youtube.com/c/RyanCollins"

[[menu.main]]
  name = "About"
  url = "/about"

[build]
  writeStats = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# syntax highlight settings
[markup]
  [markup.highlight]
    style = "dracula"
  [markup.goldmark.renderer]
    # Enable to include inline HTML
    unsafe = true
