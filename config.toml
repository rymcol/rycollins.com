baseURL = 'https://rycollins.com/'
languageCode = 'en-us'
title = 'Ryan Collins'
theme = "blist"

DefaultContentLanguage = "en"
DefaultContentLanguageInSubdir = true
[languages]
  [languages.en]
    contentDir = "content/en" #English
    weight = 1
    languageName = "English"
    [languages.en.params]
      introTitle = "Hey! I'm Ryan"
      introSubtitle = "I am an effective and highly skilled technical leader with more than 13 years experience leading and contributing to startups in cutting-edge fields"
      introPhoto = "/ryanc.jpg"
      # logo = "/blist-logo.png"
    [[languages.en.menu.main]]
        name = "Blog"
        url = "blog"
        weight = 1

    [[languages.en.menu.main]]
        name = "About"
        url = "page/about/"
        weight = 2

