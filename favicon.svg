<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#0a0e1a"/>
  <!-- Lantern glow -->
  <circle cx="256" cy="200" r="120" fill="rgba(212,168,83,0.08)"/>
  <circle cx="256" cy="200" r="70" fill="rgba(212,168,83,0.15)"/>
  <!-- Lantern body -->
  <rect x="224" y="140" width="64" height="100" rx="8" fill="none" stroke="#d4a853" stroke-width="8"/>
  <!-- Lantern top -->
  <line x1="256" y1="100" x2="256" y2="140" stroke="#d4a853" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="8" fill="#d4a853"/>
  <!-- Flame -->
  <ellipse cx="256" cy="185" rx="12" ry="20" fill="#e8c97a"/>
  <ellipse cx="256" cy="180" rx="6" ry="12" fill="#fff5e0"/>
  <!-- Lantern base -->
  <line x1="230" y1="240" x2="282" y2="240" stroke="#d4a853" stroke-width="6" stroke-linecap="round"/>
  <!-- RC monogram -->
  <text x="256" y="370" text-anchor="middle" font-family="serif" font-weight="700" font-size="120" fill="#d4a853">RC</text>
</svg>
